schema: spec-driven

context: |
  Course project (LIDR, session 2): FastAPI service that receives a meeting
  transcription and returns a software estimation generated by an LLM, using a
  CAG (Cache-Augmented Generation) architecture. Static example estimations are
  injected into the system prompt as few-shot context. No retrieval, no database,
  no persistence.

  Stack: Python 3.11, uv (pyproject.toml + uv.lock are the source of truth;
  requirements.txt is exported from the lock), FastAPI, Uvicorn, pydantic-settings,
  python-dotenv. LLM: Anthropic (claude-haiku-4-5) is the default provider,
  claude-haiku-5-5 is supported; OpenAI (gpt-4o-mini) is implemented (no live key
  yet); providers are registered in PROVIDERS; Gemini may be added later.

  Constraints:
  - Folder layout and file names are fixed by the course and checked by the
    teaching assistant: app/{main.py, config.py}, app/routers/estimations.py,
    app/services/llm_service.py, app/context/examples.py, each package with an
    __init__.py, plus .env.example, .gitignore, pyproject.toml, README.md.
  - API keys only come from .env via config.py, never hard-coded.
  - Endpoints: GET /health and POST /api/v1/estimate
    (request {transcription}; response {estimation, model, provider, ...}).
  - One change per exercise step; the user commits each step manually.
  - User-facing docs (README.md) are written in Spanish; code and specs in English.

rules:
  proposal:
    - Start the file with a level-1 title "# Proposal" on the first line (markdown linter requirement).
  specs:
    - Start each spec file with a level-1 title "# Spec" on the first line (markdown linter requirement).
  design:
    - Start the file with a level-1 title "# Design" on the first line (markdown linter requirement).
  tasks:
    - Start the file with a level-1 title "# Tasks" on the first line (markdown linter requirement).
